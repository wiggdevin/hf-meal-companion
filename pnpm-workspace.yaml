allowBuilds:
  '@google/genai': true
  protobufjs: true
  esbuild: true
  sharp: false
  unrs-resolver: false

# Dependabot alerts on transitive dev-only deps: each consumer gets the patched
# release on the major it already resolves to.
#   brace-expansion <1.1.21 (via minimatch@3 <- eslint toolchain) and
#   brace-expansion >=4 <5.0.12 (via minimatch@10 <- shadcn/ts-morph toolchain).
#
# 3 HIGH-severity advisories, all transitive, pinned to the first patched
# release on the major each consumer already resolves to (no major bumps):
#   @modelcontextprotocol/sdk >=1.12.0 <1.31.0 (via @google/genai peer dep) — GHSA-6qxp-vccf-f47h
#   sharp <0.35.5 (via next's optional image-optimization dep) — GHSA-wq5f-xc86-pv6w
#   source-map-js >=1.0.0 <1.2.2 (via @tailwindcss/node, css-tree, postcss) — GHSA-68fv-2mgg-jv7q
#
# Transitive runtime deps pinned exactly by their parent (express 5 <- @modelcontextprotocol/sdk,
# @hono/node-server <- sdk). Dependabot's security update for each failed with
# security_update_not_possible (qs, hono and @hono/node-server on 2026-11-18 and 2026-11-22, e.g.
# run 45041123795), because the parent's pin blocks the bump. Each is lifted to at least the first
# patched release, on the major it already resolves to (the key names the major, so a future
# consumer of another major is not forced onto it):
#   qs <=6.16.0 (express and body-parser) — alert 44
#   body-parser >=2.0.0 <2.4.0 (via express) — alert 17
#   hono <4.13.16 (via @hono/node-server and the sdk) — alerts 36-40
#   @hono/node-server >=2.0.0 <2.1.6 (via the sdk) — alerts 33-35
# Not overridden: minimatch 10.2.6 (alert 45, dev toolchain via ts-morph and typescript-eslint).
# Its patched release is 11.0.1, a new major, so Dependabot's update cannot be satisfied without
# a major bump of the parents; it stays open until they move.
overrides:
  'brace-expansion@1': '1.1.21'
  'brace-expansion@5': '5.0.12'
  '@modelcontextprotocol/sdk': '>=1.31.0 <2'
  'sharp': '0.35.5'
  'source-map-js': '1.2.2'
  'qs@6': '>=6.16.1 <7'
  'body-parser@2': '>=2.4.0 <3'
  'hono@4': '>=4.13.16 <5'
  '@hono/node-server@2': '>=2.1.6 <3'
